name: Android QA build
on: workflow_dispatch

permissions:
  contents: read

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test
      - run: npx expo prebuild --platform android --no-install
      - name: Build and test with the native Kotlin module
        working-directory: android
        run: ./gradlew :wupiko-alarm:testDebugUnitTest :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: Wupiko-Android-arm64-QA
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
